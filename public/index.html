<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <div class="slider1">
      <div id="slides">
        <div class="sliderUp pinkColor">
          <h2>Nature flower</h2>
          <p>all in pink</p>
        </div>
        <div class="sliderUp skyBlueColor">
          <h2>Bluuue Sky</h2>
          <p>with it's mountains</p>
        </div>
        <div class="sliderUp darkBlueColor">
          <h2>Lonely castle</h2>
          <p>in the wilderness</p>
        </div>
        <div class="sliderUp dipYellowColor">
          <h2>Flying eagle</h2>
          <p>an eagle is flying...</p>
        </div>
      </div>

    </div>
    <div class="slider2">
      <div id="slides2">
        <div class="sliderDown backimg1"></div>
        <div class="sliderDown backimg2"></div>
        <div class="sliderDown backimg3"></div>
        <div class="sliderDown backimg4"></div>
      </div>
    </div>
    <div class="btnDiv">
      <button id="upBtn"><i class="fa-solid fa-arrow-down"></i></button>
      <button id="downBtn"><i class="fa-solid fa-arrow-up"></i></button>
    </div>
  </div>


  <script type="module" src="../dist/script.js"></script>
</body>

</html>
